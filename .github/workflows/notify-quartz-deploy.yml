name: Notify Quartz deploy

# main への push を本家 Quartz（AllusionistWiki）へ repository_dispatch で通知し、
# 即座にデプロイを発火させる（毎時 schedule を待たない）。
on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: dispatch vault-updated
        run: |
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.QUARTZ_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/allusionistwiki/AllusionistWiki2/dispatches \
            -d '{"event_type":"vault-updated","client_payload":{"source":"AllusionistLLMWiki2_Obsidian"}}')
          echo "HTTP $code"; cat /tmp/resp.json
          test "$code" = "204"
